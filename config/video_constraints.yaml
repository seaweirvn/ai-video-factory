# 成片硬约束（选材/时长的护栏）。Director 的 Story Beats 可自由编排，但最终成片必须满足这里。
#
# - roles: 每个角色在一条成片里可用的镜头数量下限/上限（按飞书素材角色 HOOK/VALUE/PROOF/CTA）。
#   Story Beats 无论如何编排，落到镜头选择时都受这些数量约束。
# - clip_max_duration: 单个镜头连续播放的最长秒数（超过则该 beat 时长封顶到此值）。
# - video_duration: 成片总时长下限/上限（秒）。口播驱动的自由时长会被 clamp 到这个区间。

roles:
  HOOK:
    min: 0
    max: 1
  VALUE:
    min: 1
    max: 3
  PROOF:
    min: 0
    max: 2
  CTA:
    min: 1
    max: 1

clip_max_duration: 10

video_duration:
  min: 15
  max: 30
