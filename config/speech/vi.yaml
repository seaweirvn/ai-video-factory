# Speech Knowledge Base — Vietnamese (vi)
#
# 用途：仅用于 TTS（MiniMax）配音。字幕/页面显示永远用 caption（保持英文品牌/型号不变）。
# 作用：把英文「品牌 / 型号 / 鱼线 / 渔轮术语 / 技术名词 / 单位 / 数字 / 竞品 / 平台词」
#       换成越南本地自然读音（口播拼读）。
#
# 匹配规则（Speech Formatter 实现，非简单 replace）：
#   - 整词匹配：左边不是字母、右边不是字母或数字才算命中
#     （"S2" 不会命中 "S20"；但 "30mm"/"5kg"/"8+1" 这类「数字+单位」也能命中）；
#   - 大小写不敏感；多词短语 / 长词优先；
#   - 知识库没有的词 -> 保留 LLM 生成的 tts_text 原样，绝不报错/中断。

