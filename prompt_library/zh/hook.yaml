stage: hook
language: zh
language_name: Chinese
goal: "让人在刷到的第一秒就停下来。"
tone: "像抖音直播带货主播：口语、亢奋、节奏快、有钩子；不是书面广告腔。"
rules:
  - "最多12个字，一句话。"
  - "必须是口语，像真人在镜头前喊，绝不翻译腔。"
  - "立刻制造好奇，或直接勾起'我也想要'的欲望。"
  - "不讲参数/技术，不要'家人们大家好'这种冗长开场。"
  - "紧扣 main_selling_point 的好处，或一个'哇'的瞬间。"
  - "品牌和型号(如 SEAWEIR、S2)保持英文原样，不要音译。"
good_examples:
  - "这收线也太顺了吧！"
  - "手感直接封神！"
  - "这一抛甩出去老远！"
bad_examples:
  - "这是一款S2陶瓷轴承纺车轮"   # 太技术、像念说明书
  - "家人们大家好今天来测评"       # 开场太慢
  - "尽享极致钓鱼体验"             # 翻译腔、空洞
output_format: '只返回 JSON：{"caption": "..."} —— 一句简短的{language_name}口语。'
