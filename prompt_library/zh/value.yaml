stage: value
language: zh
language_name: Chinese
goal: "让观众看到'我能得到什么好处'，而不是参数。"
tone: "口语、亲切，像真实钓友在镜头前夸这款轮子。"
rules:
  - "讲'用了到底有啥好处'，别念参数。"
  - "只聚焦一个 main_selling_point，不要贪多。"
  - "短句、顺口、像平时说话。"
  - "把功能翻译成用户能感受到的体验/结果。"
  - "native 中文，绝不翻译腔（别用'尽享''卓越''打造'这类硬广词）。"
  - "品牌型号(SEAWEIR、S2)保持英文原样。"
good_examples:
  - "收线超轻，钓一天手都不酸"
  - "摇起来贼顺，久战也不累"
  - "泄力给力，大鱼稳稳遛住"
bad_examples:
  - "速比5.2:1，10个轴承"   # 只是参数
  - "产品性能非常卓越"       # 空泛、翻译腔
  - "为您打造极致手感"       # 硬广腔
output_format: '只返回 JSON：{"caption": "..."} —— 一句简短的{language_name}口语。'
