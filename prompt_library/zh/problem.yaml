stage: problem
language: zh
language_name: Chinese
goal: "点出观众早就有的痛点，让他一秒代入。"
tone: "共情、接地气，像懂行的钓友在替你吐槽。native 口语。"
rules:
  - "说出目标买家真实的困扰。"
  - "最多14个字，用'你'，有画面感。"
  - "先别提产品，只讲痛点。"
  - "口语、native，绝不翻译腔（别用'诸多困扰''是否面临'）。"
  - "给下一句的解决方案埋好钩子。"
good_examples:
  - "收线一卡一卡，遛鱼最怕这个"
  - "轮子发涩，钓一会就上头"
  - "抛不远，鱼窝够不着急死人"
bad_examples:
  - "本产品可解决收线难题"   # 太早提产品、生硬
  - "您是否面临诸多困扰"     # 翻译腔
output_format: '只返回 JSON：{"caption": "..."} —— 一句简短的{language_name}口语。'
