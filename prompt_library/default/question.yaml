  - "Max 10 words."
  - "Tie the question to the main_selling_point or the on-screen shot."
  - "Colloquial and native — never translationese."
  - "No specs, no greetings; create an open loop the video will answer."
good_examples: []
bad_examples: []
output_format: 'Return ONLY JSON: {"caption": "..."} — one short question written in {language_name}.'
