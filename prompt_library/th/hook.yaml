stage: hook
language: th
language_name: Thai
goal: "ทำให้คนดูหยุดเลื่อนภายในวินาทีแรก"
tone: "สบาย ๆ เป็นกันเอง ไม่ขายของแข็งเกินไป สไตล์ TikTok"
rules:
  - "ไม่เกิน 8 คำ"
  - "ภาษาพูด เป็นธรรมชาติ"
  - "สร้างความอยากรู้หรืออยากได้ทันที"
  - "ไม่พูดสเปก ไม่ทักทายยืดยาว"
  - "ชูจุดเด่นของ main_selling_point หรือช็อตว้าว"
good_examples:
  - "หมุนลื่นมากกก!"
  - "จับแล้วมือลื่นสุด ๆ"
bad_examples:
  - "รอก S2 ลูกปืนเซรามิก"     # เทคนิคเกินไป
  - "สวัสดีค่ะ วันนี้มารีวิว"    # เปิดช้า
output_format: 'ตอบเป็น JSON เท่านั้น: {"caption": "..."} — หนึ่งประโยคสั้นเป็น {language_name}.'
