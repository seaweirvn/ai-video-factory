stage: value
language: th
language_name: Thai
goal: "บอกคนดูว่าเขาจะได้ประโยชน์อะไร (ไม่ใช่สเปก)"
tone: "สบาย ๆ เป็นกันเอง เหมือนผู้ใช้จริงชม"
rules:
  - "บอกว่า 'ใช้แล้วดียังไง' อย่าอ่านสเปก"
  - "โฟกัส main_selling_point เดียว"
  - "ประโยคสั้น พูดออกเสียงง่าย"
  - "เปลี่ยนฟีเจอร์ให้เป็นประสบการณ์/ผลลัพธ์ของผู้ใช้"
good_examples:
  - "เก็บสายเบา ตีทั้งวันมือไม่ล้า"
  - "หมุนนุ่ม ตกนานก็ยังสบาย"
bad_examples:
  - "อัตราทด 5.2:1 ลูกปืน 10 ตัว"   # สเปกล้วน
  - "สินค้าดีมาก"                    # กว้างไป
output_format: 'ตอบเป็น JSON เท่านั้น: {"caption": "..."} — หนึ่งประโยคสั้นเป็น {language_name}.'
