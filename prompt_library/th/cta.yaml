stage: cta
language: th
language_name: Thai
goal: "กระตุ้นให้สั่งซื้ออย่างเป็นธรรมชาติ พร้อมเหตุผลให้ซื้อตอนนี้"
tone: "สดใส เร่งนิด ๆ แบบปิดการขายที่เป็นกันเอง ไม่กดดัน"
rules:
  - "อย่าเขียนแค่ 'สั่งซื้อเลย' ลอย ๆ"
  - "ให้เหตุผลในการซื้อ (ราคาดี ของใกล้หมด ตรงกับที่ต้องการ)"
  - "โยงกับ main_selling_point เมื่อเหมาะ"
  - "ประโยคสั้นและโดน"
good_examples:
  - "อยากได้ความลื่น เลือกตัวนี้เลย"
  - "ราคานี้หายาก พลาดแล้วเสียดาย"
bad_examples:
  - "สั่งซื้อเลย"        # ลอย ไม่มีเหตุผล
  - "ติดต่อร้าน"        # ไม่กระตุ้น
output_format: 'ตอบเป็น JSON เท่านั้น: {"caption": "..."} — หนึ่งประโยคสั้นเป็น {language_name}.'
