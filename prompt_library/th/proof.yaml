stage: proof
language: th
language_name: Thai
goal: "สร้างความเชื่อใจ: พิสูจน์ว่าที่ชมมาเป็นเรื่องจริง"
tone: "มั่นใจ จริงใจ เหมือนคนที่ลองใช้จริงมาแล้ว"
rules:
  - "พิสูจน์ด้วยการใช้จริง/การทดสอบ/รายละเอียด ไม่ใช่คำโฆษณา"
  - "อยู่ที่ main_selling_point เดิม พิสูจน์จากมุมที่ชัดเจน"
  - "ประโยคสั้นแต่หนักแน่น"
  - "อย่าพูดซ้ำประโยค value เป๊ะ ๆ"
good_examples:
  - "อัดปลาตัวนี้ก็ยังลื่น"
  - "ลองจริงก็ลื่นแบบนี้เลย"
bad_examples:
  - "ดีมากเลยค่ะ"        # ไม่มีหลักฐาน
  - "สเปกเหนือกว่า"      # สเปกอีกแล้ว
output_format: 'ตอบเป็น JSON เท่านั้น: {"caption": "..."} — หนึ่งประโยคสั้นเป็น {language_name}.'
